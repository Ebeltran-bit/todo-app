<div class="card-container">
  <p-card title="User Signup">
    <h1>Join Us!</h1>
    <p>Create an account to start managing your tasks.</p>
    <h3>Name</h3>

    <!-- Input field for the username, pInputText applies PrimeNG styling -->
    <input pInputText type="text" name="name" placeholder="Enter your new username" />

    <h3>Email</h3>
    <!-- Input field for the email, type="email" enables basic browser email validation -->
    <input pInputText type="email" name="email" placeholder="Enter your email" />

    <h3>Password</h3>
    <p-password name="password"
                placeholder="Enter your new password" 
                [feedback]="false" 
                [toggleMask]="true" />
                <!--We use [feedback] to disable password strength feedback
                And [toggleMask] to show/hide password -->

    <br><br>
    <p-button type="submit" label="Sign up and go to Login" severity="info" routerLink="/" />
    <!--This button must have a click action so that it can save the new user input -->
  </p-card>
</div>
