<div class="section-title">
        <h2>Tasks</h2>
    </div>

    <ul class="nav-list">

        @for(item of menuOptions; track item.route){
        <li>

        
            <a [routerLink]="item.route" routerLinkActive="active-item" class="nav-link">
                <i class="{{item.icon}}"></i>
                <span>{{item.label}}</span>
            </a>

        </li>
        }

    </ul>

    <div class="section-title mt-4">
        <h2>Category</h2>
    </div>

    <ul class="nav-list">
    
    @for(item of categoryOptions; track item.route){
    <li>
        <a [routerLink]="item.route" routerLinkActive="active-item" class="nav-link">
            <i class="{{item.icon}}"></i>
            <span>{{item.label}}</span>
        </a>
    </li>
    }

    <li>
        <a href="#" class="nav-link" (click)="toggleAddCategory($event)">
            <i class="pi pi-plus"></i>
            <span>Add New List</span>
        </a>
    </li>

    @if(showAddCategory) {
        <li class="add-category-field">
            <input 
                class="task-panel-input" 
                type="text" 
                [(ngModel)]="newCategoryName"
                placeholder="Category name..." /><br>
            <button pButton label="Add" severity="secondary"></button>
        </li>}

</ul>

        

    <div class="sidebar-south">

    <ul class="nav-list">
        <li>
        <a routerLink="/dashboard/calendar" routerLinkActive="active-item" class="nav-link">
            <i class="pi pi-calendar"></i>
            <span>Calendar</span>
        </a>
        </li>
        <li>
        <a routerLink="/" routerLinkActive="active-item" class="nav-link">
            <i class="pi pi-sign-out"></i>
            <span>Sign Out</span>
        </a>
        </li>
    </ul>    
</div>
